<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Abbas Bhatti Digital Hub</title>
    <meta name="description" content="Get in touch with Abbas Bhatti Digital Hub for inquiries, feedback, guest posting, or collaboration opportunities.">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; background-color: #f9f9f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #0d6efd; }
        h2 { color: #222; margin-top: 20px; border-bottom: 2px solid #0d6efd; padding-bottom: 5px; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #0d6efd; text-decoration: none; font-weight: bold; }
        .contact-info { background: #f4f7f6; padding: 15px; border-left: 4px solid #0d6efd; margin: 20px 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background-color: #0d6efd; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .submit-btn:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">&larr; Back to Home</a>
    
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or guest posting inquiries? We'd love to hear from you! Fill out the form below or reach out via email.</p>

    <div class="contact-info">
        <h3>Direct Contact Info</h3>
        <p><strong>Email:</strong> support@abc414758-code.github.io</p>
        <p><strong>Website:</strong> Abbas Bhatti Digital Hub</p>
    </div>

    <h2>Send Us a Message</h2>
    <form action="https://formspree.io/f/xbjnqpyz" method="POST">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>

</body>
</html>
